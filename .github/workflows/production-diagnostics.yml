name: 生产任务只读诊断

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "任务 ID（仅数字）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: 诊断生产任务
    runs-on: ubuntu-latest
    steps:
      - name: SSH 读取生产任务状态
        uses: appleboy/ssh-action@v1.2.0
        env:
          TASK_ID: ${{ inputs.task_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TASK_ID
          script: |
            set -eu
            case "${TASK_ID:-}" in
              ''|*[!0-9]*)
                echo '任务 ID 必须只包含数字' >&2
                exit 64
                ;;
            esac

            cd /opt/aistock
            compose='docker compose --env-file deploy/.env -f deploy/docker-compose.yml'

            echo '=== 容器状态 ==='
            $compose ps

            echo '=== 任务记录 ==='
            $compose exec -T postgres psql -v ON_ERROR_STOP=1 -U aistock -d aistock \
              -c "SELECT id, task_type, status, progress, started_at, finished_at FROM task_records WHERE id = ${TASK_ID}::integer;"

            echo '=== 任务 outbox ==='
            $compose exec -T postgres psql -v ON_ERROR_STOP=1 -U aistock -d aistock \
              -c "SELECT status, attempts, available_at, locked_at, last_error FROM task_outbox WHERE task_id = ${TASK_ID}::integer;"

            echo '=== ARQ 队列类型 ==='
            $compose exec -T redis redis-cli TYPE arq:queue

            echo '=== ARQ sorted set 队列数量 ==='
            $compose exec -T redis redis-cli ZCARD arq:queue

            echo '=== 任务在 ARQ 队列中的排名（从 0 开始） ==='
            $compose exec -T redis redis-cli ZRANK arq:queue "task:${TASK_ID}"

            echo '=== ARQ job key 是否存在 ==='
            $compose exec -T redis redis-cli EXISTS "arq:job:task:${TASK_ID}"

            echo '=== ARQ job key TTL（毫秒） ==='
            $compose exec -T redis redis-cli PTTL "arq:job:task:${TASK_ID}"

            echo '=== ARQ result key 是否存在 ==='
            $compose exec -T redis redis-cli EXISTS "arq:result:task:${TASK_ID}"

            echo '=== ARQ result key TTL（毫秒） ==='
            $compose exec -T redis redis-cli PTTL "arq:result:task:${TASK_ID}"

            echo '=== Worker 最近 20 分钟日志（最多 300 行） ==='
            $compose logs --since=20m --tail=300 worker
