# 睿见投研 production stack — 京东云 4C16G single host.
# 与 GS-Tracker 共存：GS-Tracker 占用 80/443，本系统对外用 8080(HTTP)/8443(HTTPS)。
# Usage (from repo root on the server):
#   cp deploy/.env.example deploy/.env   # fill in secrets
#   docker compose -f deploy/docker-compose.yml up -d --build

name: aistock   # 显式项目名，避免与 GS-Tracker 的 compose 项目名冲突

services:
  postgres:
    image: postgres:16-alpine
    container_name: aistock-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: aistock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env}
      POSTGRES_DB: aistock
    volumes:
      - /data/aistock/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistock"]
      interval: 10s
      retries: 5
    networks: [internal]
    # no host port — reachable only inside the compose network

  redis:
    image: redis:7-alpine
    container_name: aistock-redis
    restart: unless-stopped
    volumes:
      - /data/aistock/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [internal]

  migrator:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: aistock-backend:latest
    container_name: aistock-migrator
    restart: "no"
    command: ["./docker-entrypoint.sh"]
    environment:
      CONTAINER_ROLE: migrator
      ENV: prod
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://aistock:${POSTGRES_PASSWORD}@postgres:5432/aistock
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      DATAHUB_CONFIG_ENCRYPTION_KEY: ${DATAHUB_CONFIG_ENCRYPTION_KEY:?set it in deploy/.env}
      LLM_CONFIG_ENCRYPTION_KEY_ID: ${LLM_CONFIG_ENCRYPTION_KEY_ID:-}
      LLM_CONFIG_ENCRYPTION_KEYS: ${LLM_CONFIG_ENCRYPTION_KEYS:-}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-2000000}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: aistock-backend:latest
    container_name: aistock-api
    restart: unless-stopped
    environment:
      ENV: prod
      DEBUG: "false"
      TASK_INLINE: "false"          # scheduler runs in the worker container
      DATABASE_URL: postgresql+psycopg2://aistock:${POSTGRES_PASSWORD}@postgres:5432/aistock
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set it in deploy/.env}
      DATAHUB_CONFIG_ENCRYPTION_KEY: ${DATAHUB_CONFIG_ENCRYPTION_KEY:?set it in deploy/.env}
      LLM_CONFIG_ENCRYPTION_KEY_ID: ${LLM_CONFIG_ENCRYPTION_KEY_ID:-}
      LLM_CONFIG_ENCRYPTION_KEYS: ${LLM_CONFIG_ENCRYPTION_KEYS:-}
      # Deprecated observation-release bootstrap inputs.  Bootstrap consumes
      # them only once when the model table is empty and never overrides
      # administrator-managed configuration.  Remove them in a separate
      # post-observation release after the migration window is closed.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-2000000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrator: {condition: service_completed_successfully}
    networks: [internal]

  worker:
    image: aistock-backend:latest
    container_name: aistock-worker
    restart: unless-stopped
    command: ["./docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.tasks.queue.WorkerSettings"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      CONTAINER_ROLE: worker
      ENV: prod
      DEBUG: "false"
      TASK_INLINE: "false"
      DATABASE_URL: postgresql+psycopg2://aistock:${POSTGRES_PASSWORD}@postgres:5432/aistock
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      DATAHUB_CONFIG_ENCRYPTION_KEY: ${DATAHUB_CONFIG_ENCRYPTION_KEY:?set it in deploy/.env}
      LLM_CONFIG_ENCRYPTION_KEY_ID: ${LLM_CONFIG_ENCRYPTION_KEY_ID:-}
      LLM_CONFIG_ENCRYPTION_KEYS: ${LLM_CONFIG_ENCRYPTION_KEYS:-}
      DAILY_TOKEN_LIMIT: ${DAILY_TOKEN_LIMIT:-2000000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      api: {condition: service_started}
      migrator: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [internal]

  nginx:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: aistock-frontend:latest
    container_name: aistock-nginx
    restart: unless-stopped
    ports:
      - "8080:80"     # 80/443 已被 GS-Tracker 占用
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # 改配置后 restart 即可，无需重建镜像
      - /data/aistock/nginx/certs:/etc/nginx/certs:ro    # acme.sh certs land here
    depends_on:
      - api
    networks: [internal]

networks:
  internal:
    driver: bridge
