# 睿见投研 production nginx — serves the React SPA and proxies /api to FastAPI.
# HTTPS: after acme.sh issues certs, uncomment the 443 server block and the
# redirect line, then `docker compose -f deploy/docker-compose.yml restart nginx`.

upstream aistock_api {
    server api:8000;
}

# gzip — big JSON payloads (reports, quotes) compress well
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1k;

server {
    listen 80;
    server_name _;

    # After HTTPS is ready, uncomment to force redirect:
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;   # CSV holdings upload

    location /api/ {
        proxy_pass http://aistock_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI analysis calls can be slow
    }

    # hashed static assets — long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — React Router owns all other paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}

