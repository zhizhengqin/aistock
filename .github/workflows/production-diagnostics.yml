name: 生产任务只读诊断

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "任务 ID（仅数字）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: 诊断生产任务
    runs-on: ubuntu-latest
    steps:
      - name: SSH 读取生产任务状态
        uses: appleboy/ssh-action@v1.2.0
        env:
          TASK_ID: ${{ inputs.task_id }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TASK_ID
          script: |
            set -eu
            case "${TASK_ID:-}" in
              ''|*[!0-9]*)
                echo '任务 ID 必须只包含数字' >&2
                exit 64
                ;;
            esac

            cd /opt/aistock
            compose='docker compose --env-file deploy/.env -f deploy/docker-compose.yml'

            echo '=== 容器状态 ==='
            $compose ps

            echo '=== 任务记录 ==='
            $compose exec -T postgres psql -v ON_ERROR_STOP=1 -U aistock -d aistock \
              -c "SELECT id, task_type, status, progress, started_at, finished_at FROM task_records WHERE id = ${TASK_ID}::integer;"

            echo '=== 任务 outbox ==='
            $compose exec -T postgres psql -v ON_ERROR_STOP=1 -U aistock -d aistock \
              -c "SELECT status, attempts, available_at, locked_at, last_error FROM task_outbox WHERE task_id = ${TASK_ID}::integer;"

            echo '=== ARQ 队列类型 ==='
            $compose exec -T redis redis-cli TYPE arq:queue

            echo '=== ARQ sorted set 队列数量 ==='
            $compose exec -T redis redis-cli ZCARD arq:queue

            echo '=== 任务在 ARQ 队列中的排名（从 0 开始） ==='
            $compose exec -T redis redis-cli ZRANK arq:queue "task:${TASK_ID}"

            echo '=== ARQ job key 是否存在 ==='
            $compose exec -T redis redis-cli EXISTS "arq:job:task:${TASK_ID}"

            echo '=== ARQ job key TTL（毫秒） ==='
            $compose exec -T redis redis-cli PTTL "arq:job:task:${TASK_ID}"

            echo '=== ARQ result key 是否存在 ==='
            $compose exec -T redis redis-cli EXISTS "arq:result:task:${TASK_ID}"

            echo '=== ARQ result key TTL（毫秒） ==='
            $compose exec -T redis redis-cli PTTL "arq:result:task:${TASK_ID}"

            echo '=== ARQ result 安全元数据 ==='
            $compose exec -T worker python - "$TASK_ID" <<'PY'
            import asyncio
            import inspect
            import sys

            from arq import create_pool
            from arq.jobs import Job

            from app.tasks.queue import get_redis_settings


            async def main(task_id: str) -> None:
                pool = None
                try:
                    pool = await create_pool(get_redis_settings())
                    info = await Job(f"task:{task_id}", redis=pool).result_info()
                    if info is None:
                        print("has_result: false")
                        return
                    print("has_result: true")
                    print(f"success: {info.success}")
                    print(f"function: {info.function}")
                    print(f"job_try: {info.job_try}")
                    print(f"start_time: {info.start_time}")
                    print(f"finish_time: {info.finish_time}")
                    if not info.success:
                        print(f"result_type: {type(info.result).__name__}")
                except Exception as exc:
                    print(f"result_info_error_type: {type(exc).__name__}")
                finally:
                    if pool is not None:
                        close = getattr(pool, "aclose", None) or getattr(pool, "close", None)
                        if close is not None:
                            try:
                                closed = close()
                                if inspect.isawaitable(closed):
                                    await closed
                            except Exception as exc:
                                print(f"result_info_close_error_type: {type(exc).__name__}")


            asyncio.run(main(sys.argv[1]))
            PY

            echo '=== LLM 结构校验摘要 ==='
            $compose exec -T worker python - "$TASK_ID" <<'PY'
            import sys

            from pydantic import ValidationError
            from sqlalchemy import select

            from app.core.database import SessionLocal
            from app.models.llm_execution import LlmCallAttempt
            from app.schemas.llm_outputs import ChiefDecisionOutput


            def _loc(value) -> str:
                return ".".join(str(part) for part in value) or "<root>"


            def main(task_id: int) -> None:
                session = SessionLocal()
                try:
                    rows = session.execute(
                        select(
                            LlmCallAttempt.attempt_no,
                            LlmCallAttempt.status,
                            LlmCallAttempt.result_json,
                        )
                        .where(
                            LlmCallAttempt.task_id == task_id,
                            LlmCallAttempt.step_key == "stock.chief.v1",
                        )
                        .order_by(LlmCallAttempt.attempt_no.desc())
                    ).all()
                    if not rows:
                        print("has_attempt: false")
                        return

                    for attempt_no, status, result_json in rows:
                        try:
                            ChiefDecisionOutput.model_validate(result_json)
                        except ValidationError as exc:
                            print(f"attempt_no: {attempt_no}")
                            print(f"status: {status}")
                            for error in exc.errors():
                                input_value = error.get("input")
                                validation_loc = _loc(error.get("loc", ()))
                                print(f"validation_loc: {validation_loc}")
                                print(f"validation_type: {error.get('type', 'unknown')}")
                                print(f"input_type: {type(input_value).__name__}")
                                print(f"input_repr: {repr(input_value)[:120]}")
                        else:
                            print(f"attempt_no: {attempt_no}")
                            print(f"status: {status}")
                            print("schema: valid")
                except Exception as exc:
                    print(f"llm_summary_error_type: {type(exc).__name__}")
                finally:
                    session.close()


            main(int(sys.argv[1]))
            PY

            echo '=== Worker 最近 20 分钟日志（最多 300 行） ==='
            $compose logs --since=20m --tail=300 worker
